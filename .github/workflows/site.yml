name: site

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Preview artifact only. No Pages deployment here: cutover to gh-pages
      # is a later wave and only after the owner has seen the site.
      - name: Upload site preview
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: dist